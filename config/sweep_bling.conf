# Standard ZMK USB logging
CONFIG_ZMK_USB_LOGGING=y

# PS/2 Trackpoint Configuration (Infused-Kim Driver)
# NOTE: The following symbols are automatically enabled by devicetree:
# - CONFIG_PS2=y (selected by ZMK_INPUT_MOUSE_PS2)
# - CONFIG_PS2_UART=y (auto-enabled by uart-ps2 compatible in devicetree)
# - CONFIG_ZMK_INPUT_MOUSE_PS2=y (auto-enabled by zmk,input-mouse-ps2 compatible in devicetree)
# Do not manually set any of these - they're automatically configured.

# Enable PIO based PS/2 driver
CONFIG_PS2_PIO=y

# PS/2 GPIO Interrupt Logging (Diagnostic)
# Enable detailed logging of every GPIO interrupt for trackpoint debugging
# CONFIG_PS2_GPIO_INTERRUPT_LOG_ENABLED=y

# Increase log startup delay to ensure PS/2 init messages appear
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000


