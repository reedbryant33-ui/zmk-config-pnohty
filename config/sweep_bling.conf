# Standard ZMK USB logging
CONFIG_ZMK_USB_LOGGING=y

# PS/2 GPIO Interrupt Logging (Diagnostic)
# Enable detailed logging of every GPIO interrupt for trackpoint debugging
# CONFIG_PS2_GPIO_INTERRUPT_LOG_ENABLED=y

# Increase log startup delay to ensure PS/2 init messages appear
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Enable Pointing (ZMK Mouse)
CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_POINTING=y

# Enable PS/2 Subsystem
CONFIG_PS2=y

# Enable Dynamic Interrupts for PIO
CONFIG_DYNAMIC_INTERRUPTS=y

# Enable PS/2 PIO Driver
CONFIG_PS2_PIO=y
# CONFIG_PS2_GPIO=y

# Enable PS/2 Mouse Processing
CONFIG_ZMK_INPUT_MOUSE_PS2=y

# Set PS/2 Log Level to Debug
CONFIG_PS2_LOG_LEVEL_DBG=y


