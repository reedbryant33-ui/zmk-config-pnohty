# Enable ZMK Pointing
CONFIG_ZMK_POINTING_DEVICE=y
CONFIG_INPUT_MOUSE=y
CONFIG_INPUT_MOUSE_PS2_PIO=y

# Standard ZMK Bluetooth and Power settings (Keep your existing ones)

# DO NOT include PS2_GPIO or ZMK_INPUT_MOUSE_PS2...
# Those are the "undefined symbols" crashing your build.CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_PHYSICAL_LAYOUTS=n
