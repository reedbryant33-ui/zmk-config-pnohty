# Pete Johanson's PIO-based UART PS/2 device driver
# Implements PS/2 protocol using RP2040 PIO UART

description: Pete Johanson PS/2 UART Device (PIO-based)

compatible: "petejohanson,ps2-uart"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: |
      GPIO array with two entries:
      - First entry: SDA (Data) GPIO pin with flags
      - Second entry: SCL (Clock) GPIO pin with flags
      Example: gpios = <&gpio0 2 GPIO_ACTIVE_HIGH>, <&gpio0 3 GPIO_ACTIVE_HIGH>

  label:
    required: false
    description: Optional label for the device

  status:
    required: false
